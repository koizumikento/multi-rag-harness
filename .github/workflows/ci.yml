name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Install isolated modern MCP client for interoperability test
        run: |
          uv venv "$RUNNER_TEMP/mrh-sdk2-client"
          uv pip install --python "$RUNNER_TEMP/mrh-sdk2-client/bin/python" 'mcp==2.3.0'

      - name: Test
        run: |
          export MRH_MODERN_CLIENT_PYTHON="$RUNNER_TEMP/mrh-sdk2-client/bin/python"
          uv run coverage run -m pytest
          uv run coverage report

      - name: Build distributions
        run: uv build --sdist --wheel --out-dir /tmp/multi-rag-harness-dist

      - name: Set up Node for Sites adapter
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify Sites adapter and artifact
        working-directory: sites
        run: |
          npm test
          npm run build
          npm run validate
